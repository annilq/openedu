[project]
name = "agent-core"
version = "0.1.0"
description = "业务无关的通用 Agent 框架内核（协议 + 注册 + 路由 + 工具调用 + 统一事件流）"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_core"]
