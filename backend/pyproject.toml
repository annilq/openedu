[project]
name = "app"
version = "0.1.0"
description = "娃娃学习App 后端（基于 fastapi/full-stack-fastapi-template 二次开发）"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard]>=0.141.1,<1.0.0",
    "python-multipart<1.0.0,>=0.0.27",
    "pydantic>2.0",
    "sqlmodel>=0.0.39,<1.0.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "pyjwt<3.0.0,>=2.13.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "httpx<1.0.0,>=0.25.1",
    # 可插拔 LLM：OpenAI 兼容端点覆盖国产模型（混元/通义/DeepSeek 等），
    # 换厂商只需改 base_url/model（ADR-003 / T03）
    "langchain-openai>=0.2.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest<10.0.0,>=7.4.3",
    "ruff<1.0.0,>=0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.pytest.ini_options]
markers = [
    "smoke: 真实大模型连通测试（需 LLM_PROVIDER=langchain + key + RUN_LLM_SMOKE=1）",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]
