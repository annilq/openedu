<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>轴对称·面重合演示（修正版）</title>
<style>
 body{font-family:system-ui,'PingFang SC',sans-serif;background:#FDFBF7;color:#1a1a1a;margin:0;padding:20px}
 .wrap{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
 .panel{background:#fff;border:2px solid #1a1a1a;border-radius:14px;padding:16px;box-shadow:6px 6px 0 rgba(0,0,0,.12)}
 svg{width:420px;height:420px;background:#fff;display:block}
 .ctrl{margin:10px 0;display:flex;flex-direction:column;gap:4px;min-width:260px}
 label{font-weight:600;font-size:13px}
 input[type=range]{width:100%}
 .row{display:flex;gap:10px;align-items:center;margin-top:6px}
 button{font:inherit;padding:8px 14px;border:2px solid #1a1a1a;border-radius:10px;background:#fff;cursor:pointer}
 button:hover{background:#f0ece4}
 .status{margin-top:12px;font-weight:700;font-size:15px;padding:8px 12px;border-radius:8px}
 .ok{background:#e7f6ec;color:#1b7f3b;border:1px solid #1b7f3b}
 .bad{background:#fdeaea;color:#b42318;border:1px solid #b42318}
 .hint{font-size:12px;color:#666;max-width:280px;margin-top:8px;line-height:1.5}
 .deg{font-weight:800;color:#b86b16}
</style>
</head>
<body>
<h2>轴对称·面重合演示（修正版）</h2>
<div class="wrap">
 <div class="panel">
  <svg id="svg" viewBox="0 0 400 400"></svg>
 </div>
 <div class="panel">
  <div class="ctrl">
   <label>图形</label>
   <select id="fig">
     <option value="house">房子（竖轴对称）</option>
     <option value="kite">风筝（竖/横轴对称）</option>
     <option value="arrow">箭头（横轴对称）</option>
     <option value="para">平行四边形（非轴对称）</option>
   </select>
  </div>
  <div class="ctrl">
   <label>对称轴角度 <span id="angv">90</span>°（0=水平，90=竖直）</label>
   <input id="ang" type="range" min="0" max="180" value="90" step="1">
  </div>
  <div class="ctrl">
   <label>对称轴水平位置 <span id="cxv">0.50</span></label>
   <input id="cx" type="range" min="0.3" max="0.7" value="0.5" step="0.01">
  </div>
  <div class="ctrl">
   <label>对称轴垂直位置 <span id="cyv">0.50</span></label>
   <input id="cy" type="range" min="0.3" max="0.7" value="0.5" step="0.01">
  </div>
  <div class="ctrl">
   <label>对折进度 <span id="prv">0</span>% → 对折角度 <span id="deg" class="deg">0</span>°</label>
   <input id="pr" type="range" min="0" max="100" value="0" step="1">
  </div>
  <div class="row">
   <button id="play">播放对折</button>
   <button id="reset">重置</button>
  </div>
  <div id="status" class="status"></div>
  <p class="hint">折叠角 = 进度 × 180°。只有折叠侧在 <b>180°</b> 时完全盖住静止侧（面积重合），才判定为轴对称。中途（含 90° 半边塌到轴上）一律不算重合。</p>
 </div>
</div>
<script>
const S=400;
const shapes={
 house:[[0.30,0.70],[0.70,0.70],[0.70,0.45],[0.50,0.25],[0.30,0.45]],
 kite:[[0.50,0.20],[0.72,0.50],[0.50,0.80],[0.28,0.50]],
 arrow:[[0.20,0.42],[0.62,0.42],[0.62,0.30],[0.82,0.50],[0.62,0.70],[0.62,0.58],[0.20,0.58]],
 para:[[0.30,0.40],[0.70,0.40],[0.82,0.70],[0.42,0.70]]
};
function px(p){return [p[0]*S,p[1]*S];}
// 半平面裁剪：保留 n·(P-C)*keepSign >= 0 的一侧（keepSign=-1 保留 v<=0 静止侧；+1 保留 v>=0 折叠侧）
function clip(poly,Cx,Cy,nx,ny,keepSign){
 const out=[];const N=poly.length;
 for(let i=0;i<N;i++){
   const A=poly[i],B=poly[(i+1)%N];
   const va=(A[0]-Cx)*nx+(A[1]-Cy)*ny;
   const vb=(B[0]-Cx)*nx+(B[1]-Cy)*ny;
   const sa=va*keepSign, sb=vb*keepSign;
   const Ain=sa>=-1e-9, Bin=sb>=-1e-9;
   if(Ain)out.push(A);
   if(Ain!==Bin){const t=va/(va-vb);out.push([A[0]+t*(B[0]-A[0]),A[1]+t*(B[1]-A[1])]);}
 }
 return out;
}
function pathOf(poly){
 if(poly.length<3)return "";
 return "M "+poly.map(p=>{const q=px(p);return q[0].toFixed(2)+" "+q[1].toFixed(2);}).join(" L ")+" Z";
}
// 顶点关于轴全反射（θ=π）
function reflectAll(poly,Cx,Cy,dx,dy,nx,ny){
 return poly.map(P=>{
   const u=(P[0]-Cx)*dx+(P[1]-Cy)*dy;
   const v=(P[0]-Cx)*nx+(P[1]-Cy)*ny;
   return [Cx+u*dx - v*nx, Cy+u*dy - v*ny];
 });
}
function near(a,b,t){return Math.hypot(a[0]-b[0],a[1]-b[1])<t;}
function isAxisymmetric(poly,Cx,Cy,dx,dy,nx,ny){
 const R=reflectAll(poly,Cx,Cy,dx,dy,nx,ny);
 const T=0.03;
 return R.every(r=>poly.some(p=>near(r,p,T)));
}
let anim=null;
function render(){
 const fig=document.getElementById('fig').value;
 const poly=shapes[fig];
 const ang=+document.getElementById('ang').value;
 const Cx=+document.getElementById('cx').value, Cy=+document.getElementById('cy').value;
 const pr=+document.getElementById('pr').value;
 document.getElementById('angv').textContent=ang;
 document.getElementById('cxv').textContent=Cx.toFixed(2);
 document.getElementById('cyv').textContent=Cy.toFixed(2);
 document.getElementById('prv').textContent=pr;
 // 关键：折叠角 = 进度 × 180°（θ: 0→π）
 const theta=pr/100*Math.PI;
 document.getElementById('deg').textContent=Math.round(pr/100*180);
 const a=ang*Math.PI/180;
 const dx=Math.cos(a),dy=Math.sin(a);        // 轴方向
 const nx=-Math.sin(a),ny=Math.cos(a);        // 法向
 const stat=clip(poly,Cx,Cy,nx,ny,-1);        // 静止侧 v<=0
 const fold=clip(poly,Cx,Cy,nx,ny,+1);        // 折叠侧 v>=0
 // 折叠侧按 θ 变换：沿轴分量 u 不变，法向分量 v' = v·cosθ
 const foldT=fold.map(P=>{
   const u=(P[0]-Cx)*dx+(P[1]-Cy)*dy;
   const v=(P[0]-Cx)*nx+(P[1]-Cy)*ny;
   const nf=v*Math.cos(theta);
   return [Cx+u*dx+nf*nx, Cy+u*dy+nf*ny];
 });
 const L=0.46;
 const A1=[(Cx-L*dx)*S,(Cy-L*dy)*S], A2=[(Cx+L*dx)*S,(Cy+L*dy)*S];
 const symmetric=isAxisymmetric(poly,Cx,Cy,dx,dy,nx,ny);
 const st=document.getElementById('status');
 let svg='';
 // 参考轮廓（始终可见）
 svg+='<path d="'+pathOf(poly)+'" fill="none" stroke="#bbb" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.6"/>';
 // 静止侧（青）
 svg+='<path d="'+pathOf(stat)+'" fill="#3aa6b9" fill-opacity="0.35" stroke="#1f6f7d" stroke-width="1.5"/>';
 // 折叠侧（橙，覆盖在上）
 svg+='<path d="'+pathOf(foldT)+'" fill="#e8a13a" fill-opacity="0.55" stroke="#b86b16" stroke-width="1.5"/>';
 // 对称轴
 svg+='<line x1="'+A1[0].toFixed(1)+'" y1="'+A1[1].toFixed(1)+'" x2="'+A2[0].toFixed(1)+'" y2="'+A2[1].toFixed(1)+'" stroke="#444" stroke-width="2" stroke-dasharray="6 4"/>';
 document.getElementById('svg').innerHTML=svg;
 // 重合判定严格门控于 180°（progress≈100）且轴为真正对称线
 if(pr>=99 && symmetric){ st.className='status ok'; st.textContent='✓ 对折 180°：折叠侧完全盖住静止侧 —— 是轴对称图形'; }
 else if(pr>=99 && !symmetric){ st.className='status bad'; st.textContent='✗ 对折 180°：折叠侧无法盖住静止侧 —— 该轴不是对称轴'; }
 else { st.className='status'; st.textContent='对折进行中（'+Math.round(pr/100*180)+'°），仅到 180° 才能判断是否重合'; }
}
document.getElementById('fig').onchange=()=>{
 const v=document.getElementById('fig').value;
 document.getElementById('ang').value = (v==='arrow')?0:90;
 document.getElementById('cx').value=0.5; document.getElementById('cy').value=0.5;
 document.getElementById('pr').value=0; if(anim)cancelAnimationFrame(anim); anim=null;
 render();
};
['ang','cx','cy','pr'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{ if(anim)cancelAnimationFrame(anim); anim=null; render(); }));
document.getElementById('reset').onclick=()=>{ if(anim)cancelAnimationFrame(anim); anim=null; document.getElementById('pr').value=0; render(); };
document.getElementById('play').onclick=()=>{
 if(anim)cancelAnimationFrame(anim);
 let cur=+document.getElementById('pr').value; if(cur>=100)cur=0;
 const step=()=>{
   cur+=1.2; if(cur>=100)cur=100;
   document.getElementById('pr').value=cur; render();
   if(cur<100){anim=requestAnimationFrame(step);} else {anim=null;}
 };
 anim=requestAnimationFrame(step);
};
render();
</script>
</body>
</html>
