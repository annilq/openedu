name: CI

# 质量门禁：任意一步失败即整轮红。
# 注意：本仓库在“沙箱环境”下 flutter_tester 无法启动、后端部分 AI 路由测试触发
# 敏感内容保护，故本地沙箱跑不了 flutter test / pytest；本工作流面向真实
# GitHub runner（ubuntu-latest 可正常 spawn flutter_tester），推上去即自动验证。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: Verify Flutter version
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze (zero issues required)
        run: flutter analyze
      - name: Run tests
        run: flutter test --reporter=github

  backend:
    name: Ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --no-dev || uv sync
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Run tests
        run: uv run pytest -q
