services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wawa
      POSTGRES_PASSWORD: wawa
      POSTGRES_DB: wawa
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wawa"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://wawa:wawa@db:5432/wawa
      SECRET_KEY: ${SECRET_KEY:-change-me-in-prod}
      PROJECT_NAME: 娃娃学习App
      # 模型经「模型管理」配置（无本地 LLM_PROVIDER mock 兜底）；此处仅注入管理员内置模型预设。
      # BUILTIN_MODELS 为 JSON 数组：[{"id","provider","model_name","base_url?"}]，provider ∈ {ollama, openai_compat}
      BUILTIN_MODELS: ${BUILTIN_MODELS:-[]}
      MODEL_APIKEY_SECRET: ${MODEL_APIKEY_SECRET:-}
    ports:
      - "8000:8000"

volumes:
  pgdata:
