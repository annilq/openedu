services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wawa
      POSTGRES_PASSWORD: wawa
      POSTGRES_DB: wawa
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wawa"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://wawa:wawa@db:5432/wawa
      SECRET_KEY: ${SECRET_KEY:-change-me-in-prod}
      PROJECT_NAME: 娃娃学习App
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "8000:8000"

volumes:
  pgdata:
