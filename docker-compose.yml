services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wawa
      POSTGRES_PASSWORD: wawa
      POSTGRES_DB: wawa
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wawa"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://wawa:wawa@db:5432/wawa
      SECRET_KEY: ${SECRET_KEY:-change-me-in-prod}
      PROJECT_NAME: 娃娃学习App
      # 模型一律由家长在「模型管理」里手动添加（ADR-0039：无内置模型目录）。
      # MODEL_APIKEY_SECRET 必须与「添加模型」时一致，否则已存 API Key 解不开（ADR-0038）：
      # 本地开发请与 backend/.env 填同一个值。
      MODEL_APIKEY_SECRET: ${MODEL_APIKEY_SECRET:-}
    ports:
      - "8000:8000"

volumes:
  pgdata:
